name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Fzhenhong/dsh-purge-pj'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          # 只取当前版本段落（"# <version>" 到下一个 "# 1." 之前），
          # 别把历史所有版本的记录整篇塞进 Release 正文。
          notes="$(awk -v v="${version}" '
            /^# / { if ($0 == "# " v) { on = 1; next } else if (on) { exit } }
            on { print }
          ' release-notes.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "release-notes.md 里没有 # ${version} 段落"
            exit 1
          fi
          zip="dsh-purge-pj-${version}.zip"
          prefix="dsh-purge-pj-${version}/"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="$prefix" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes "$notes"
          else
            git archive --format=zip --prefix="$prefix" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes")
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
